connector.name=hive
hive.metastore=file
# Добавляем явную схему file:// для локального метастора контейнера
hive.metastore.catalog.dir=file:///tmp/trino-hive-meta

# Настройки подключения к MinIO (S3)
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadminpassword
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
