services:
  # Менеджер распределенной координации (нужен для Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Брокер сообщений Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Сервер Kafka Connect со встроенным плагином Debezium для PostgreSQL
  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REREPLICATION_FACTOR: 1
      OFFSET_STORAGE_REREPLICATION_FACTOR: 1
      STATUS_STORAGE_REREPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Отключаем внутренние схемы JSON, чтобы сообщения в Kafka были чистыми и читаемыми
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONNECTORS_RESTART_POLICY_CLASS: "org.apache.kafka.connect.runtime.rest.errors.ComplexConnectorsRestartPolicy"
      CONNECT_TASKS_MAX_RETRIES: "10"

  # Удобный веб-интерфейс для мониторинга топиков и сообщений в Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - debezium # Добавляем в зависимости, чтобы UI ждал Debezium
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083


  # Локальное S3-совместимое хранилище данных (Data Lake)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # Порт для API (туда будут слаться данные)
      - "9001:9001" # Порт для Web-консоли
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
    # Распределенный SQL-движок Trino для Data Lake
  trino:
    image: trinodb/trino:435
    container_name: trino
    depends_on:
      - minio
    ports:
      - "8060:8080" # Будет доступен локально на порту 8060
    volumes:
      # Прокидываем настройки каталогов внутрь контейнера
      - ./trino/catalog:/etc/trino/catalog
  
  # База данных для метаданных самого Airflow
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Оркестратор Apache Airflow
  airflow:
    build: .
    container_name: airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    user: "50000"
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
      trino:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      - LOAD_EXEMPLARY_DAGS=false
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@airflow-db/airflow
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW_CONN_TRINO_DEFAULT=trino://admin@trino:8080/minio.crypto?catalog=minio

  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: kafka-connect-init
    depends_on:
      debezium:
        condition: service_started
    volumes:
      - ./debezium_postgres_config.json:/tmp/debezium_postgres_config.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka Connect REST API..."
        until curl -sf http://debezium:8083/connectors > /dev/null; do
          echo "Kafka Connect not ready yet, retrying in 5s..."
          sleep 5
        done
        echo "Kafka Connect is ready. Creating connector..."
        # Проверяем, существует ли уже коннектор
        if curl -sf http://debezium:8083/connectors/crypto-postgres-connector > /dev/null; then
          echo "Connector already exists, skipping creation."
        else
          curl -X POST -H "Content-Type: application/json" \
               --data @/tmp/debezium_postgres_config.json \
               http://debezium:8083/connectors
          echo "Connector created."
        fi

  kafka-to-s3:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: kafka-to-s3
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  minio_data:
