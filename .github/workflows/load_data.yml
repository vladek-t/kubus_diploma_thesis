name: Cloud DB Data Ingestion

on:
  schedule:
    # Запуск каждые 15 минут (можно настроить под себя)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой в UI Git

jobs:
  run-injector:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install dependencies
      run: |
        pip install psycopg2-binary

    - name: Install dependencies
      run: |
        pip install psycopg2-binary requests

    - name: Run API Fetcher
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python fetch_api_data.py
